name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    name: lint, tipos, tests y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar herramientas
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests scripts

      - name: Ruff (formato)
        run: ruff format --check src tests scripts

      - name: mypy (tipos)
        run: mypy

      - name: pytest (unit + estructura)
        run: pytest

      - name: import-linter (regla de dependencia)
        run: lint-imports

  web:
    name: frontend (Astro + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos y componentes Astro
        run: npm run check

      - name: Build
        run: npm run build

  secrets:
    name: escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: gitleaks revisa también los commits anteriores.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Escanear el historial
        run: gitleaks git --redact --verbose --config .gitleaks.toml
