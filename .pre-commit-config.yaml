repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: local
    hooks:
      - id: lint-imports
        name: reglas de dependencia (import-linter)
        entry: lint-imports
        language: system
        pass_filenames: false
        files: '^(src|pyproject\.toml)'
      - id: mypy
        name: tipos (mypy)
        entry: mypy
        language: system
        pass_filenames: false
        files: '^(src|tests|scripts)/.*\.py$'
      - id: pytest-repo-contract
        name: contrato de estructura del repo
        entry: pytest tests/unit/test_repo_contract.py
        language: system
        pass_filenames: false
        files: '^(src)/'
